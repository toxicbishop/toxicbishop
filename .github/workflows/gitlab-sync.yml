name: Sync to GitLab

on:
  push:
    branches:
      - master

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        run: |
          git remote add gitlab https://toxicbishop:${{ secrets.GITLAB_TOKEN }}@gitlab.com/toxicbishop/toxicbishop.git
          git push gitlab master
