name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: toxicbishop
          template: classic
          config_display: large
          config_timezone: Asia/Calcutta
          
          # Base options (Clean: removed repositories, community)
          base: header, metadata
          

          # 2. Lines (Contribution History - Clean)
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: repositories

          # 3. Languages plugin
          plugin_languages: yes
          plugin_languages_limit: 10
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_colors: "#FFD43B:python, #3178C6:typescript, github"
          plugin_languages_ignored: html, css, scss


          # 4. Clean Setup
          config_padding: 0, 8 + 11%
