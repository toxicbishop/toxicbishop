name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: toxicbishop
          template: classic
          config_display: large
          config_timezone: Asia/Calcutta
          
          # Base stats (Let's ensure these work first)
          base: header, activity, community, repositories, metadata

          # 1. Languages 
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_colors: "github"
          plugin_languages_limit: 8

          # 2. Coding Habits (LOWERED COMPLEXITY to prevent errors)
          plugin_habits: yes
          plugin_habits_from: 200       
          plugin_habits_days: 14        
          plugin_habits_facts: yes      
          plugin_habits_charts: no      # Turned off charts temporarily to fix error

          # 3. Isometric Calendar (This is heavy, let's keep it simple)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
