name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: toxicbishop
          template: classic
          base: ""
          config_timezone: Asia/Calcutta
          
          # 1. Languages (With your Custom Colors)
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_colors: "github"
          plugin_languages_colors_overrides: |
            python:#FFD43B
            typescript:#3178C6

          # 2. Coding Habits (New!)
          plugin_habits: yes
          plugin_habits_from: 200       # Analyze last 200 events
          plugin_habits_days: 14        # Look at last 14 days
          plugin_habits_facts: yes      # Show "Most productive day" text
          plugin_habits_charts: yes     # Show the bar charts

          # 3. Isometric Calendar / Streak (New!)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
