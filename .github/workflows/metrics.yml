name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: toxicbishop
          template: classic
          config_display: large
          config_timezone: Asia/Calcutta
          
          # Base options (Clean: removed repositories, community)
          base: header, metadata
          

          # 2. Lines (Contribution History - Clean)
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: repositories

          # 3. Habits (Commits per day)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: no # Text only

          # 4. Clean Setup
          config_padding: 0, 8 + 11%
