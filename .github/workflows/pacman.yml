name: Generate pacman animation

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create dist directory
        run: mkdir -p dist

      - name: generate pacman-contribution-graph.svg
        run: |
          mkdir -p dist
          npx -y pacman-contribution-graph --platform github --username ${{ github.repository_owner }} --game pacman --gameTheme github --output dist/pacman-contribution-graph.svg
          npx -y pacman-contribution-graph --platform github --username ${{ github.repository_owner }} --game pacman --gameTheme github-dark --output dist/pacman-contribution-graph-dark.svg
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          GITHUB_TOKEN: ${{ secrets.PACMAN_TOKEN || secrets.GITHUB_TOKEN }}
          INPUT_GITHUB_TOKEN: ${{ secrets.PACMAN_TOKEN || secrets.GITHUB_TOKEN }}

      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
